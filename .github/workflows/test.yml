name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder

  # Database and account tests against Supabase's own local version, so they
  # meet the same limits as the live project (decided 17 Nov 2026, design
  # Section 10E point 10).
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start Supabase's local version
        run: npx supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,postgres-meta,supavisor,mailpit
      - run: node scripts/supabase-test-env.mjs >> "$GITHUB_ENV"
      - run: npm run test:supabase
      - name: Build the app against Supabase's local version
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_TEST_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
      - run: npx playwright install --with-deps chromium
      - name: Passkey steps in a test browser
        run: npm run test:browser
